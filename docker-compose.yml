version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  db:
    image: postgres:15-alpine
    container_name: acpia-db
    environment:
      POSTGRES_DB: acpia
      POSTGRES_USER: investigator
      POSTGRES_PASSWORD: acpiapassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigator -d acpia"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Neo4j Graph Database
  neo4j:
    image: neo4j:5.12-community
    container_name: acpia-neo4j
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt port
    environment:
      NEO4J_AUTH: neo4j/acpiagraphpassword123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "acpiagraphpassword123", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 3. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: acpia-qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. FastAPI Backend Application
  backend:
    build: ./backend
    container_name: acpia-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://investigator:acpiapassword123@db:5432/acpia
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=acpiagraphpassword123
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SECRET_KEY=acpia-production-key-change-this-anytime
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # 5. Next.js Frontend Application
  frontend:
    build: ./frontend
    container_name: acpia-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
